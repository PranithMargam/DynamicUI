name: DynamicUI
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  DynamicUI:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
targets:
  Forma:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Assets.xcassets]
      - path: App/Assets.xcassets/product.imageset/product.jpg
        buildPhase: resources
    dependencies:
      - package: DynamicUI
        product: DynamicUICore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dynamicui.forma
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
  FormaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Forma
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  FormaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Forma
      - package: DynamicUI
        product: DynamicUICore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Forma:
    build:
      targets:
        Forma: all
    test:
      gatherCoverageData: true
      targets: [FormaTests, FormaUITests]
